---
name: Reusable Test
on:
  workflow_call:
jobs:
  reusable_test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Use uv cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/uv
          key: uv

      - name: Use tox cache
        uses: actions/cache@v6.1.0
        with:
          path: .tox
          key: tox-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install yarn
        run: sudo npm install yarn -g

      - name: Use frontend dependencies cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            frontend/.yarn/cache
            frontend/node_modules
          key: frontend-deps-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            frontend-deps-

      - name: Install linters binaries
        run: make install-linters-binaries

      - name: Install uv
        run: pip install uv

      - name: Install tox
        run: pip install tox

      - name: Sync tox environment
        run: tox -e py-requirements

      - name: Install js dependencies
        run: make yarn-install-locked

      - name: Run tests
        run: make test

      - name: Run codecov
        uses: codecov/codecov-action@v7.0.0
